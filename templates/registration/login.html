{% load static %}
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ingreso - Agricola Riachuelo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body class="login-body">
    <main class="login-panel">
      <div class="brand login-brand"><span class="brand-mark">AR</span><span>Agricola Riachuelo</span></div>
      <h1>Ingresar</h1>
      <p>Sesion Django para especialistas, supervisores y administradores.</p>
      {% if form.errors %}<div class="alert alert-danger">Credenciales no validas.</div>{% endif %}
      <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}" />
        <label>Correo{{ form.username }}</label>
        <label>Contrasena{{ form.password }}</label>
        <button class="btn btn-success w-100" type="submit">Entrar</button>
      </form>
    </main>
  </body>
</html>
